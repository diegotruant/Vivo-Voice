name: Android APK

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write # attach the APK to GitHub Releases

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Optional: default VoceViva server baked into the app (Settings → Variables → VOCEVIVA_SERVER_URL).
      # Users can still change it in the app ("Configura Coach AI" → "Server VoceViva").
      VITE_API_BASE_URL: ${{ vars.VOCEVIVA_SERVER_URL }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: npx tsc --noEmit

      - name: Build web app and sync Android project
        run: |
          echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          npx vite build
          npx cap sync android

      - name: Build debug APK (installable for testing)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Decode release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK + AAB (Play Store)
        if: steps.keystore.outputs.path != ''
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Collect outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/VoceViva-${VERSION_NAME}-${VERSION_CODE}-debug.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "out/VoceViva-${VERSION_NAME}-${VERSION_CODE}.apk"
            cp android/app/build/outputs/bundle/release/app-release.aab "out/VoceViva-${VERSION_NAME}-${VERSION_CODE}.aab"
          fi
          ls -la out

      - name: Verify APK (package, version, permissions)
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          for apk in out/*.apk; do
            echo "== $apk ($(du -h "$apk" | cut -f1))"
            "$AAPT2" dump badging "$apk" | grep -E "^package:|^application-label:|^uses-permission:|^sdkVersion:|^targetSdkVersion:"
            "$AAPT2" dump badging "$apk" | grep -q "android.permission.RECORD_AUDIO" || { echo "::error::RECORD_AUDIO mancante"; exit 1; }
            unzip -l "$apk" | grep -q "assets/public/index.html" || { echo "::error::interfaccia web mancante nell'APK"; exit 1; }
            "$(dirname "$AAPT2")/apksigner" verify --verbose --print-certs "$apk" | grep -E "Verified using|Signer #1 certificate (DN|SHA-256)"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: VoceViva-android-${{ github.run_number }}
          path: out/*
          retention-days: 30

      - name: Publish test APK (rolling pre-release "android-test")
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/*-debug.apk out/VoceViva-debug.apk
          NOTES="Versione di prova Android (build ${VERSION_CODE}, commit ${GITHUB_SHA::7}, branch ${GITHUB_REF_NAME}).

          Dal telefono: tocca **VoceViva-debug.apk** qui sotto, aprilo e consenti l'installazione da origini sconosciute.
          Si installa sopra la versione di prova precedente (stessa firma). Non adatta al Play Store."
          if ! gh release view android-test >/dev/null 2>&1; then
            gh release create android-test --prerelease --target "$GITHUB_SHA" \
              --title "VoceViva – versione di prova Android" --notes "$NOTES"
          else
            gh release edit android-test --prerelease --notes "$NOTES"
          fi
          gh release upload android-test out/VoceViva-debug.apk --clobber

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Stable file name too, for a direct phone-friendly download link
          cp out/*-debug.apk out/VoceViva-debug.apk
          gh release upload "${{ github.event.release.tag_name }}" out/* --clobber
